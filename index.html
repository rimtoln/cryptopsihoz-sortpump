function tokState(k,t){const a=wrapT(t-k.s);const side=k.bad?1:-1;

/* ---------- camera: scripted zooms like an explainer ---------- */

 for(const [nm,ang] of CHECKS){const p=rp(R,ang,TRACK);let hot=0;for(const s of toks)if(s&&s.ph==='ring'&&s.ring===(color===col.red?1:0)){const d=Math.abs(((s.ang-ang)%360+540)%360-180);hot=Math.max(hot,1-smooth(0,14,d))}

 T(label,x,y-30,15,color,'700','center');T(String(inside),x,y+18,52,col.white,'700','center',SANS);T('INSIDE',x,y+42,12,col.dim,'700','center')}

 RR(x-78,y-32,156,64,10,'#081510','#3f7a54',1.6);Rc(x-14,y-46,28,14,'#0b1d14','#3f7a54');

 const na=-Math.PI/2+needle;Ln(x,y,x+Math.cos(na)*18,y+Math.sin(na)*18,col.white,2.2);Ci(x,y,3,col.white);
 Ci(x-52,y,8,litL>.05?rgba(col.green,.3+.7*litL):'#0d2016','#3f7a54');Ci(x+52,y,8,litR>.05?rgba(col.red,.3+.7*litR):'#200d0b','#7a3a30');
 if(litL>.05)Glow(x-52,y,30,rgba(col.green,.5*litL));if(litR>.05)Glow(x+52,y,30,rgba(col.red,.5*litR));
 T('SCANNER',x,y+54,13,col.mint,'700','center');T('CONTRACT · DEV · LP · BUNDLES',x,y+71,10,col.dim,'400','center')}
function tray(t,passedRecent){RR(TRAY.x,TRAY.y,TRAY.w,TRAY.h,6,'#06120c','#3f7a54',1.4);for(let j=1;j<10;j++)Ln(TRAY.x+j*28,TRAY.y+6,TRAY.x+j*28,TRAY.y+TRAY.h-6,'rgba(63,122,84,0.25)',1);
 T('WATCHLIST · PASSED',TRAY.x+TRAY.w/2,TRAY.y+TRAY.h+26,13,col.green,'700','center');T(String(passedRecent),TRAY.x+TRAY.w/2,TRAY.y+TRAY.h+66,34,col.green,'700','center',SANS);T('LAST 20s',TRAY.x+TRAY.w/2,TRAY.y+TRAY.h+84,10,col.dim,'400','center')}

 Ln(BIN.x-8,BIN.y,BIN.x+BIN.w+8,BIN.y,'#ff4a3d',2.4);
 T('RUG BIN · BLOCKED',BIN.x+BIN.w/2,BIN.y+BIN.h+30,13,col.red,'700','center');T(String(blockedRecent),BIN.x+BIN.w/2,BIN.y+BIN.h+70,34,col.red,'700','center',SANS);T('LAST 20s',BIN.x+BIN.w/2,BIN.y+BIN.h+88,10,col.dim,'400','center')}

  if(s.ph==='scan'){lx=s.x;ly=s.y-44;al='center'}

  if(s.fail>.5)T('FAIL · DEV SOLD',lx,ly+13,9,col.red,'700',al)}
 c.restore()}

 Ln(540,210,540,340,col.wire,1.6);c.save();c.setLineDash([3,9]);c.lineDashOffset=-t*36;Ln(540,210,540,340,'rgba(198,247,214,0.4)',1.6);c.restore()}

/* ---------- static background cache ---------- */
let bgCache=null;
function buildBg(){const s=document.createElement('canvas');s.width=Math.round(W*K);s.height=Math.round(H*K);const live=c;c=s.getContext('2d');c.setTransform(K,0,0,K,0,0);

 for(let y=170;y<1130;y+=24)for(let x=28;x<1060;x+=24)Rc(x,y,1,1,'rgba(120,180,140,0.12)');

/* ---------- frame ---------- */
function render(T0){const t=wrapT(T0),u=t/LOOP*TAU;c.setTransform(K,0,0,K,0,0);c.drawImage(bgCache,0,0,W,H);
 const S=TOK.map(k=>tokState(k,t)),cam=camAt(t),z=cam[2];
 const inside=[0,0];S.forEach(s=>{if(s&&s.ph==='ring')inside[s.ring]++});
 let passed=0,blocked=0;TOK.forEach(k=>{const r=wrapT(t-k.s)-k.arr;if(r>=0&&r<20){if(k.bad||k.flip)blocked++;else passed++}});

  T('CLEAN',(462+EL[0])/2-30,430,11,col.green,'700','center');T('RUG',(618+ER[0])/2+30,430,11,col.red,'700','center');T('FAILED INSIDE',560,800,10,'#ff8a76','700','center');
  ringFx(RL,col.green,'QUALITY',inside[0],t,1,S);ringFx(RRg,col.red,'TRASH',inside[1],t,-1,S);
  scanner(t,S);tray(t,passed);bin(t,blocked);traders(t);
  S.forEach((s,i)=>{if(s&&s.ph!=='bin')token(s,TOK[i],z)});clip(BIN.x-10,BIN.y-30,BIN.w+20,BIN.h+30,()=>S.forEach((s,i)=>{if(s&&s.ph==='bin')token(s,TOK[i],z)}));
